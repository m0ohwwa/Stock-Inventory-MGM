{% extends 'inventory/base.html' %}

{% block title %}Delete Category - Stock Inventory System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 shadow-sm border-0 text-center">
            <div class="text-danger mb-3">
                <i class="fa-solid fa-triangle-exclamation fs-1"></i>
            </div>
            <h5 class="fw-bold mb-2">Delete Category?</h5>
            <p class="text-muted small">Are you sure you want to delete category <strong>"{{ category.name }}"</strong>? This action cannot be undone.</p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'category_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
